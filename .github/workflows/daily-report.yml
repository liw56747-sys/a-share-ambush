name: A股收盘埋伏复盘

on:
  schedule:
    # 每周一至五 15:30 北京时间（UTC+8 -> UTC 07:30）
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}  # 支持手动触发测试

permissions:
  contents: write
  pages: write
  id-token: write

# 允许同一 workflow 内并发部署，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成报告
        run: python report.py

      - name: 推送到微信（Server酱）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          MD=$(ls reports/wechat-summary-*.md 2>/dev/null | tail -1)
          if [ -n "$MD" ]; then
            python notify.py "$MD"
          else
            echo "未找到微信摘要文件，跳过推送"
          fi

      - name: 提交学习记忆（history/learn 目录）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 分别 add，避免某个目录不存在导致整条 git add 失败
          for d in history learn; do
            [ -d "$d" ] && git add "$d" || true
          done
          if git diff --cached --quiet; then
            echo "无学习记忆变更"
          else
            git commit -m "learn: 记录 $(date +%F) 信号与调参" && git push || echo "提交失败，跳过"
          fi

      - name: 准备 Pages 静态目录
        run: |
          mkdir -p _site
          cp reports/latest.html _site/index.html
          # 历史报告也一并保留，便于回溯
          cp reports/ambush-report-*.html _site/ 2>/dev/null || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
